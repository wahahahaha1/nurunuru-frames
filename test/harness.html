<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>NuruNuru Frames — Harness</title>
<style>
  body { background: #111; color: #ddd; font: 14px/1.5 system-ui, sans-serif; margin: 16px; }
  #stage { position: relative; display: inline-block; background: #000; }
  #stage video { display: block; width: 960px; height: 540px; }
  pre { background: #1b1b1b; padding: 8px; max-width: 1200px; overflow: auto; }
  button, select { margin-right: 6px; }
</style>
</head>
<body>
<h1>NuruNuru Frames — テストハーネス</h1>
<p>
  <select id="clip">
    <option>pan</option><option>fastpan</option><option>object</option><option>zoom</option><option>testsrc</option>
  </select>
  <input type="file" id="file" accept="video/*">
  <button id="quality">品質テスト (全クリップ)</button>
  <button id="play">補間再生</button>
  <label><input type="checkbox" id="demo"> デモ (左: 元 / 右: 補間)</label>
</p>
<div id="stage"><video id="v" muted playsinline loop crossorigin="anonymous"></video></div>
<pre id="log"></pre>
<script src="../extension/content/settings.js"></script>
<script src="../extension/content/engine/gpu.js"></script>
<script src="../extension/content/engine/shaders.js"></script>
<script src="../extension/content/engine/interpolator.js"></script>
<script src="../extension/content/sites.js"></script>
<script src="../extension/content/overlay.js"></script>
<script src="../extension/content/clock.js"></script>
<script src="../extension/content/audio-sync.js"></script>
<script src="../extension/content/osd.js"></script>
<script src="../extension/content/main.js"></script>
<script src="harness.js"></script>
</body>
</html>
